<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Heebo',sans-serif;
  background:#060c14;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px;
  direction:rtl;color:#fff;
}
#loading{display:flex;flex-direction:column;align-items:center;gap:16px;color:rgba(200,230,255,0.5);font-size:15px}
.spinner{width:40px;height:40px;border:3px solid rgba(74,222,128,0.2);border-top-color:#4ade80;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#card-wrap{display:none;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px}

/* CARD */
.card{
width:100%;
border-radius:28px;
position:relative;
box-shadow:0 24px 64px rgba(0,0,0,0.85);
aspect-ratio:9/14;
overflow:visible;
}
.card-inner{
position:absolute;inset:0;
border-radius:28px;overflow:hidden;
}
.card-bg-avatar{
position:absolute;inset:0;z-index:0;
display:flex;align-items:center;justify-content:center;
background:#0d1a10;overflow:hidden;
}
.card-bg-avatar img{
width:100%;height:100%;object-fit:cover;
filter:blur(24px) brightness(0.42) saturate(1.6);
transform:scale(1.15);
}
.card-bg-emoji{
font-size:200px;
filter:blur(22px) brightness(0.42);
transform:scale(1.2);
}
.card-vignette{
position:absolute;inset:0;z-index:1;
background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0.0) 0%,rgba(0,0,0,0.72) 100%);
}

/* EMOJI RAIN */
.rain-layer{position:absolute;inset:0;overflow:hidden;z-index:2;pointer-events:none}
.rain-drop{position:absolute;top:-30px;user-select:none;pointer-events:none;}
@keyframes rainFall{
0%  {opacity:0;  transform:translateY(0px) translateX(0px) rotate(0deg) scale(0.5)}
8%  {opacity:0.85}
82% {opacity:0.4}
100%{opacity:0;  transform:translateY(var(–ey)) translateX(var(–ex)) rotate(var(–er)) scale(1.1)}
}

/* GREEN CIRCLE — top center, half outside */
.circle-wrap{
position:absolute;
top:0;left:50%;
transform:translate(-50%,-46%);
z-index:10;
display:flex;flex-direction:column;align-items:center;
}
.halo{position:absolute;border-radius:50%;pointer-events:none;top:50%;left:50%;}
@keyframes haloBreath{
0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.4}
50%{transform:translate(-50%,-50%) scale(1.22);opacity:0.85}
}
.green-circle{
width:100px;height:100px;border-radius:50%;
background:linear-gradient(145deg,#4ade80,#22c55e,#16a34a);
box-shadow:0 0 0 4px rgba(74,222,128,0.45),0 0 36px rgba(74,222,128,0.65),0 8px 24px rgba(0,0,0,0.5);
display:flex;align-items:center;justify-content:center;
position:relative;z-index:2;flex-shrink:0;
}
.circle-avatar-inner{
width:74px;height:74px;border-radius:50%;
border:2.5px solid rgba(255,255,255,0.75);
background:rgba(255,255,255,0.2);
display:flex;align-items:center;justify-content:center;
font-size:36px;overflow:hidden;
}
.circle-avatar-inner img{width:100%;height:100%;object-fit:cover}

/* CARD CONTENT */
.card-content{
position:absolute;inset:0;z-index:4;
display:flex;flex-direction:column;
align-items:center;justify-content:flex-end;
padding:0 16px 16px;
}

/* שם מתחת לעיגול */
.user-name{
position:absolute;
top:60px;left:0;right:0;
text-align:center;
font-size:26px;font-weight:900;
color:#fff;
text-shadow:0 2px 16px rgba(0,0,0,0.95);
padding:0 12px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* טקסט הדיווח — ממש באמצע */
.status-block{
position:absolute;
top:50%;left:0;right:0;
transform:translateY(-50%);
display:flex;flex-direction:column;align-items:center;gap:6px;
padding:0 16px;
}
.status-ok-text{
font-size:28px;font-weight:900;
color:#fff;
text-shadow:0 0 24px rgba(74,222,128,0.7), 0 2px 16px rgba(0,0,0,0.9);
display:flex;align-items:center;gap:8px;
animation:textGlow 2.8s ease-in-out infinite;
}
@keyframes textGlow{
0%,100%{text-shadow:0 0 18px rgba(74,222,128,0.5),0 2px 14px rgba(0,0,0,0.9)}
50%{text-shadow:0 0 36px rgba(74,222,128,0.95),0 0 60px rgba(74,222,128,0.4),0 2px 14px rgba(0,0,0,0.9)}
}
.status-sign{font-size:18px;color:rgba(255,255,255,0.8);font-weight:700}

/* שעה */
.status-time{
font-size:16px;font-weight:700;
color:rgba(255,255,255,0.75);
text-align:center;
margin-bottom:12px;
text-shadow:0 1px 8px rgba(0,0,0,0.9);
}

/* emoji animations */
.anim-float {animation:eFloat  2.5s ease-in-out infinite}
.anim-heart {animation:eHeart  1s   ease-in-out infinite}
.anim-wave  {animation:eWave   1.2s ease-in-out infinite}
.anim-spin  {animation:eSpin   3s   linear      infinite}
.anim-shake {animation:eShake  0.7s ease-in-out infinite}
.anim-bounce{animation:eBounce 1.4s ease-in-out infinite}
@keyframes eFloat {0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.07)}}
@keyframes eHeart {0%,100%{transform:scale(1)}14%{transform:scale(1.32)}28%{transform:scale(1)}42%{transform:scale(1.2)}}
@keyframes eWave  {0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}75%{transform:rotate(-10deg)}}
@keyframes eSpin  {from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes eShake {0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-7deg)}75%{transform:translateX(5px) rotate(7deg)}}
@keyframes eBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}70%{transform:translateY(-3px)}}

/* REACT BUTTON — קטן יותר, פונט גדול יותר */
.react-btn{
width:80%;
border:none;border-radius:18px;
padding:14px 20px;
color:#fff;cursor:pointer;font-family:inherit;
box-shadow:0 8px 32px rgba(26,158,80,0.55);
display:flex;align-items:center;justify-content:center;gap:8px;
text-decoration:none;
font-size:20px;font-weight:900;
transition:transform 0.15s;
background:linear-gradient(135deg,#16a34a,#4ade80,#15803d,#22c55e);
background-size:300% 300%;
animation:gradMove 3s ease infinite;
}
@keyframes gradMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.react-btn:active{transform:scale(0.97)}

.app-tag{font-size:11px;color:rgba(255,255,255,0.22);text-align:center;margin-top:2px}

/* not found */
#not-found{display:none;flex-direction:column;align-items:center;gap:12px;text-align:center;color:rgba(200,230,255,0.5)}
#not-found h2{font-size:20px;color:rgba(200,230,255,0.8)}
</style>

</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdErGgHq1ens9kQiQzofowxFsyeS2hjNY",
  authDomain: "ani-beseder-57800.firebaseapp.com",
  projectId: "ani-beseder-57800",
  storageBucket: "ani-beseder-57800.firebasestorage.app",
  messagingSenderId: "596709424854",
  appId: "1:596709424854:web:3aadf6233f4a9a84ac9377",
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const emojiAnim = (e) => {
  if(['❤️','💕','💗','🌸'].includes(e)) return 'anim-heart';
  if(['🌟','⭐','✨','⚡','💫'].includes(e)) return 'anim-spin';
  if(['😊','👋','🙌'].includes(e)) return 'anim-wave';
  if(['💪','🔥','👊','🤜'].includes(e)) return 'anim-shake';
  if(['🎉','🥳','🎊','🎈'].includes(e)) return 'anim-bounce';
  return 'anim-float';
};

function buildRain(emoji) {
  const layer = document.getElementById('rainLayer');
  layer.innerHTML = '';
  for(let i = 0; i < 32; i++){
    const span = document.createElement('span');
    span.className = 'rain-drop';
    span.textContent = emoji;
    span.style.left = `${2 + Math.random()*94}%`;
    span.style.setProperty('--ex', `${(Math.random()-0.5)*80}px`);
    span.style.setProperty('--ey', `${350 + Math.random()*320}px`);
    span.style.setProperty('--er', `${(Math.random()-0.5)*480}deg`);
    const dur = 1.8 + Math.random()*3;
    const delay = Math.random()*5;
    span.style.fontSize = `${10 + Math.random()*22}px`;
    // animation מלא inline — כולל duration וdelay
    span.style.animation = `rainFall ${dur}s linear ${delay}s infinite`;
    layer.appendChild(span);
  }
}

async function load() {
  const params = new URLSearchParams(location.search);
  let uid = params.get('u') || params.get('uid') || params.get('follow');
  if(!uid){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('not-found').style.display = 'flex';
    return;
  }
  try{
    const [statusSnap, userSnap] = await Promise.all([
      getDoc(doc(db,'status',uid)),
      getDoc(doc(db,'users',uid)),
    ]);
    if(!statusSnap.exists() && !userSnap.exists()){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('not-found').style.display = 'flex';
      return;
    }
    const sd = statusSnap.data() || {};
    const ud = userSnap.data()   || {};
    const name      = sd.name || ud.displayName || 'משתמש';
    const moodEmoji = sd.moodEmoji || '✅';
    const sign      = sd.sign || '';
    const photoURL  = sd.profilePhotoURL || ud.profilePhotoURL || null;
    let timeStr = '';
    const ts = sd.timestamp;
    if(ts){
      const d = ts.toDate();
      timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    document.title = `${name} ${moodEmoji} – אני בסדר`;

    // רקע מטושטש
    const bgEl = document.getElementById('cardBgAvatar');
    if(photoURL){
      bgEl.innerHTML = `<img src="${photoURL}" alt=""/>`;
    } else {
      const d = document.createElement('div');
      d.className = 'card-bg-emoji';
      d.textContent = moodEmoji;
      bgEl.appendChild(d);
    }

    // עיגול
    const innerEl = document.getElementById('circleAvatarInner');
    if(photoURL){ innerEl.innerHTML = `<img src="${photoURL}" alt=""/>`; }
    else { innerEl.textContent = moodEmoji; }

    // הילות
    [[160,0,2.8],[130,0.4,3.2],[105,0.8,3.6]].forEach(([sz,del,dur],i)=>{
      const h = document.getElementById(`halo${i+1}`);
      h.style.cssText = `width:${sz}px;height:${sz}px;top:50%;left:50%;background:radial-gradient(circle,rgba(74,222,128,0.3) 0%,transparent 70%);animation:haloBreath ${dur}s ease-in-out ${del}s infinite;`;
    });

    // שם
    document.getElementById('userName').textContent = name;

    // אמוג'י ראשי
    const emojiEl = document.getElementById('mainEmojiEl');
    emojiEl.textContent = moodEmoji;
    emojiEl.className = emojiAnim(moodEmoji);

    // sign
    const cleanSign = (sign && sign !== '?' && sign !== '...') ? sign : '';
    document.getElementById('signEl').textContent = cleanSign;

    // שעה
    document.getElementById('timeEl').textContent = timeStr || '';

    // לינק
    document.getElementById('reactBtn').href = `https://anibeseder.com/?follow=${uid}`;

    // הצג
    document.getElementById('loading').style.display = 'none';
    document.getElementById('card-wrap').style.display = 'flex';

    // גשם — אחרי render
    requestAnimationFrame(() => requestAnimationFrame(() => buildRain(moodEmoji)));

  } catch(err){
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('not-found').style.display = 'flex';
    document.getElementById('not-found').innerHTML += `<p style="font-size:11px;color:rgba(255,100,100,0.7);max-width:300px;word-break:break-all">${err.message}</p>`;
  }
}

load();
</script>

</body>
