      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          npx cap init "Ani Beseder" com.anibeseder.app --web-dir www
          npx cap add ios
          # Set minimum deployment target to iOS 13
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/App/Podfile || \
          sed -i "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '13'/platform :ios, '13.0'/" ios/App/Podfile || true
          # Force update
          cd ios/App && pod install --repo-update
          cd ../..
          npx cap sync ios
