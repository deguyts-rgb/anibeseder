workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 18
      vars:
        BUNDLE_ID: "com.anibeseder.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: WW26QA54J4
        APP_STORE_CONNECT_ISSUER_ID: 1265afc2-cdf5-454f-8b20-0a72db990c70
        APPLE_TEAM_ID: N58RZ47Z46
    scripts:
      - name: Install Capacitor 6
        script: |
          npm install -g @capacitor/cli@6
          npm init -y
          npm install @capacitor/core@6 @capacitor/ios@6
      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.anibeseder.app",
            "appName": "Ani Beseder",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          cd ios/App && pod install --repo-update
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect create-certificate --type IOS_DISTRIBUTION
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          mkdir -p build
          cat > build/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>N58RZ47Z46</string>
          </dict>
          </plist>
          EOF
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath ../../build/App.xcarchive \
            -exportPath ../../build/ipa \
            -exportOptionsPlist ../../build/export_options.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
