workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 18
      groups:
        - default
      vars:
        BUNDLE_ID: "com.anibeseder.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: WW26QA54J4
        APP_STORE_CONNECT_ISSUER_ID: 1265afc2-cdf5-454f-8b20-0a72db990c70
        APPLE_TEAM_ID: N58RZ47Z46
    scripts:
      - name: Install Capacitor 6
        script: |
          npm install -g @capacitor/cli@6
          npm init -y
          npm install @capacitor/core@6 @capacitor/ios@6
      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.anibeseder.app",
            "appName": "Ani Beseder",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          python3 - << 'PYEOF'
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()
          inject = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          """
          content = content.replace('post_install do |installer|', 'post_install do |installer|' + inject)
          with open('ios/App/Podfile', 'w') as f:
              f.write(content)
          print('Podfile patched')
          PYEOF
          cd ios/App && pod install --repo-update
      - name: Write API Key
        script: |
          mkdir -p ~/.private_keys
          python3 -c "
          import os
          key = os.environ['APP_STORE_CONNECT_PRIVATE_KEY']
          kid = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          path = os.path.expanduser(f'~/.private_keys/AuthKey_{kid}.p8')
          with open(path, 'w') as f:
              f.write(key)
          print('Key written, length:', len(key))
          "
          chmod 600 ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
      - name: Build IPA
        script: |
          mkdir -p build
          cat > build/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>N58RZ47Z46</string>
          </dict>
          </plist>
          EOF
          KEY=~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $KEY \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath ../../build/App.xcarchive \
            -exportPath ../../build/ipa \
            -exportOptionsPlist ../../build/export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath $KEY \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
