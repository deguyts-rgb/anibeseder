workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 18
      vars:
        BUNDLE_ID: "com.anibeseder.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: WW26QA54J4
        APP_STORE_CONNECT_ISSUER_ID: 1265afc2-cdf5-454f-8b20-0a72db990c70
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm init -y
          npm install @capacitor/core @capacitor/ios
      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.anibeseder.app",
            "appName": "Ani Beseder",
            "webDir": "www",
            "ios": {
              "minVersion": "13.0"
            }
          }
          EOF
          npx cap add ios
          python3 -c "
          import re
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()
          content = re.sub(r\"platform :ios, '[^']*'\", \"platform :ios, '13.0'\", content)
          with open('ios/App/Podfile', 'w') as f:
              f.write(content)
          print('Podfile:', open('ios/App/Podfile').read()[:200])
          "
          cd ios/App && pod install --repo-update
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.anibeseder.app --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath ../../build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath ../../build/App.xcarchive -exportPath ../../build/ipa -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
