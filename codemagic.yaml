workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 18
      groups:
        - default
      vars:
        BUNDLE_ID: "com.anibeseder.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: WW26QA54J4
        APP_STORE_CONNECT_ISSUER_ID: 1265afc2-cdf5-454f-8b20-0a72db990c70
        APPLE_TEAM_ID: N58RZ47Z46
    scripts:
      - name: Install Capacitor 6
        script: |
          npm install -g @capacitor/cli@6
          npm init -y
          npm install @capacitor/core@6 @capacitor/ios@6
      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.anibeseder.app",
            "appName": "Ani Beseder",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          python3 - << 'PYEOF'
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()
          inject = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          """
          content = content.replace('post_install do |installer|', 'post_install do |installer|' + inject)
          with open('ios/App/Podfile', 'w') as f:
              f.write(content)
          PYEOF
          cd ios/App && pod install --repo-update
      - name: Set App Icon
        script: |
          curl -o icon.png https://anibeseder.com/icon-512.png
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          for size in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $size $size icon.png --out "$ICON_DIR/icon-${size}.png"
          done
          cat > "$ICON_DIR/Contents.json" << 'EOF'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"icon-40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"icon-60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"icon-58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"icon-87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"icon-80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"icon-120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"icon-120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"icon-180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"icon-20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"icon-40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"icon-29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"icon-58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"icon-40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"icon-80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"icon-76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"icon-152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"icon-167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"icon-1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          EOF
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all 3
      - name: Write API Key
        script: |
          mkdir -p ~/.private_keys
          python3 -c "
          import os
          body = os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].strip()
          body = body.replace('-----BEGIN PRIVATE KEY-----','').replace('-----END PRIVATE KEY-----','').replace('\n','').replace(' ','').strip()
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          kid = os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER']
          path = os.path.expanduser(f'~/.private_keys/AuthKey_{kid}.p8')
          with open(path, 'w') as f:
              f.write(pem)
          print('PEM written OK:')
          print(pem)
          "
          chmod 600 ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
      - name: Build IPA
        script: |
          mkdir -p build
          cat > build/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>N58RZ47Z46</string>
          </dict>
          </plist>
          EOF
          KEY=~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath $KEY \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath ../../build/App.xcarchive \
            -exportOptionsPlist ../../build/export_options.plist \
            -exportPath ../../build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath $KEY \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
