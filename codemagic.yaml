workflows:
  ios-pwa:
    name: iOS PWA Build
    max_build_duration: 60
    environment:
      xcode: latest
      node: 18
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anibeseder.app
      vars:
        BUNDLE_ID: "com.anibeseder.app"
        APP_STORE_CONNECT_KEY_IDENTIFIER: WW26QA54J4
        APP_STORE_CONNECT_ISSUER_ID: 1265afc2-cdf5-454f-8b20-0a72db990c70
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm init -y
          npm install @capacitor/core @capacitor/ios
      - name: Init iOS project
        script: |
          mkdir -p www
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://anibeseder.com"></head></html>' > www/index.html
          npx cap init "Ani Beseder" com.anibeseder.app --web-dir www
          npx cap add ios
          npx cap sync ios
      - name: Build IPA
        script: |
          xcode-project use-profiles
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build​​​​​​​​​​​​​​​​
