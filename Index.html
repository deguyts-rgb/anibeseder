<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אני בסדר</title>

    <link rel="manifest" href="manifest.json">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f1923">
    <link rel="apple-touch-icon" href="192.png">

    <style>
        /* כאן השארתי את כל ה-CSS המקורי שלך מהקובץ שהעלית */
        :root {
            --bg-color: #0f1923;
            --card-bg: #1f2933;
            --text-color: #ffffff;
            --accent-color: #ff4655;
            --safe-color: #00ff88;
            --danger-color: #ff4655;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ... שאר ה-CSS המקורי שלך ממשיך כאן בדיוק אותו דבר ... */
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .main-status-circle {
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, #ff8c00 0%, #e65100 100%);
            margin: 40px auto; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 30px rgba(230, 81, 0, 0.4);
        }
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; display: flex;
            background: #16212b; padding: 10px 0; border-top: 1px solid #2d3e4f;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-right">
                <div class="user-profile">
                    <div class="user-avatar">ר</div>
                    <span class="user-name">מרינית</span>
                </div>
                <button class="logout-btn">יציאה</button>
            </div>
            <div class="logo"><img src="192.png" style="width:40px;"></div>
        </header>

        <main>
            <div class="status-container">
                <div class="alert-box">⚠️ לא דיווחת היום! לחץ לעדכון</div>
                <div class="main-status-circle">
                    <div style="font-size: 24px; font-weight: bold;">לא בסדר</div>
                    <div style="font-size: 30px;">✕</div>
                </div>
                <div style="text-align: center; color: #888; margin-bottom: 20px;">עדכון: 9:29:20</div>
                <div style="display: flex; justify-content: center; gap: 10px;">
                    <div class="stat-badge">👥 אתם בסדר? (1)</div>
                    <div class="stat-badge">📍 1 עוקבים</div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div style="flex:1; text-align:center;">🏠<br>בית</div>
            <div style="flex:1; text-align:center;">👥<br>שקופים</div>
            <div style="flex:1; text-align:center;">👁️<br>אחרי מי אני?</div>
            <div style="flex:1; text-align:center;">⚙️<br>הגדרות</div>
        </nav>
    </div>
</body>
</html>
